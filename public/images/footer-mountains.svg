      <stop offset="0%" stop-color="#12303c" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#0e252f" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#081820" />
      <stop offset="100%" stop-color="#040e13" />
    </linearGradient>

    {/* Far snowy ridge gradient */}
